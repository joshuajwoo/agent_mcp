[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-rag"
version = "0.1.0"
description = "SQuAD ingestion and Qdrant indexing for an MCP-backed RAG agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0.0",
  "fastmcp>=2.3.0,<4.0.0",
  "langchain>=1.0.0,<2.0.0",
  "langchain-anthropic>=1.0.0,<2.0.0",
  "langchain-mcp-adapters>=0.1.0,<1.0.0",
  "langgraph>=1.0.0,<2.0.0",
  "python-dotenv>=1.1.0",
  "qdrant-client>=1.12.0",
  "sentence-transformers>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/rag_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
